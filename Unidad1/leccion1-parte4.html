<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OVA - Matriz Comparativa (Acordeones)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap');

        :root {
            --color-1: #F0D0CE; /* Rosa claro */
            --color-2: #BA5239; /* Rojo óxido */
            --color-3: rgba(70, 99, 96, 1.00); /* #466360 - Verde pizarra (Color íconos) */
            --color-4: #CED82D; /* Verde lima */
            --color-5: #F3F4BC; /* Amarillo pálido */
            --color-6: #3B6B8A; /* Azul acero */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Bloqueo de scroll general del iframe/ventana */
        html, body {
            width: 100%;
            height: 100vh;
            font-family: 'Roboto', sans-serif;
            overflow: hidden;
            background-color: var(--color-6);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1, h2, h3, .title-font {
            font-family: 'Montserrat', sans-serif;
        }

        /* Contenedor principal con fondo y overlay */
        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1577896851231-70ef18881754?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(59, 107, 138, 0.85); /* --color-6 con transparencia */
            z-index: 1;
        }

        /* Caja de contenido central */
        .content-box {
            position: relative;
            z-index: 2;
            background: white;
            border-radius: 15px;
            width: 100%;
            max-width: 1100px; /* Un poco más ancho para las dos columnas */
            height: 100%;
            max-height: 90vh; /* Limita la altura para no hacer scroll en la ventana */
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            border-top: 8px solid var(--color-4);
            overflow: hidden;
        }

        /* Cabecera fija dentro de la caja */
        .header-section {
            padding: 25px 30px;
            background: white;
            border-bottom: 2px solid rgba(0,0,0,0.05);
            flex-shrink: 0;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .main-title {
            color: var(--color-2);
            font-size: 24px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .main-title i {
            color: var(--color-3); /* Color de íconos solicitado */
            font-size: 28px;
        }

        .intro-text {
            color: #444;
            font-size: 15px;
            line-height: 1.6;
            text-align: justify;
        }

        /* Contenedor de los acordeones con SCROLL INTERNO y GRID de 2 COLUMNAS */
        .accordions-wrapper {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px 30px;
            background: #fdfdfd;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px 20px;
            align-items: start; /* Evita que el acordeón cerrado se estire si el de al lado se abre */
        }

        /* Elemento Acordeón */
        .accordion-item {
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
            border: 1px solid rgba(0,0,0,0.05);
            border-left: 5px solid var(--color-3);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .accordion-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .accordion-header {
            padding: 16px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 15px;
            color: var(--color-6);
            transition: background 0.3s;
        }

        .accordion-header:hover {
            background: rgba(70, 99, 96, 0.04);
        }

        .accordion-title-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .accordion-icon {
            color: var(--color-3); /* Color de íconos solicitado */
            font-size: 20px;
            width: 25px;
            text-align: center;
        }

        .toggle-icon {
            color: var(--color-2);
            font-size: 18px;
            transition: transform 0.3s ease;
        }

        .accordion-item.active .toggle-icon {
            transform: rotate(180deg);
            color: var(--color-3);
        }

        /* Contenido del acordeón */
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            background: white;
        }

        /* Conceptos enfrentados en una sola línea */
        .accordion-inner {
            padding: 0 15px 15px 15px;
            display: flex;
            flex-direction: row;
            gap: 10px;
        }

        /* Viñetas comparativas */
        .comparison-bullet {
            flex: 1; /* Ocupan 50% y 50% */
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            font-size: 14px;
            line-height: 1.4;
            color: #333;
            box-shadow: 0 2px 5px rgba(0,0,0,0.04);
        }

        .bullet-irregular {
            background-color: var(--color-1);
            border-left: 4px solid var(--color-2);
        }

        .bullet-integral {
            background-color: var(--color-5);
            border-left: 4px solid var(--color-4);
        }

        .bullet-label {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            color: var(--color-6);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 6px;
        }
        
        .bullet-label i {
            font-size: 14px;
            color: var(--color-3);
        }

        .bullet-text {
            flex-grow: 1;
            text-align: justify;
        }

        /* Scrollbar personalizado */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.04); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--color-3); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--color-6); }

        /* Comportamiento responsivo */
        @media (max-width: 900px) {
            .accordion-inner { flex-direction: column; }
        }

        @media (max-width: 768px) {
            .accordions-wrapper { 
                grid-template-columns: 1fr; /* Pasa a 1 columna en móviles */
                padding: 15px 20px; 
            }
            .header-section { padding: 20px; }
            .main-title { font-size: 20px; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="overlay"></div>
        
        <div class="content-box">
            
            <!-- Cabecera Fija -->
            <div class="header-section">
                <h2 class="main-title title-font">
                    <i class="fa-solid fa-code-compare"></i> 
                    Matriz Comparativa de Modelos
                </h2>
                <p class="intro-text">
                    En resumen, algunos de los aspectos más importantes frente a la distinción entre el modelo tutelar o de situación irregular y el modelo del Sistema de protección integral de corte garantista constitucional:
                </p>
            </div>

            <!-- Zona Scrolleable de Acordeones -->
            <div class="accordions-wrapper" id="accordionContainer">
                <!-- Se inyecta mediante JS -->
            </div>

        </div>
    </div>

    <script>
        // Datos de la matriz comparativa copiados estrictamente del documento.
        const matrixData = [
            {
                category: "Fuentes normativas principales",
                icon: "fa-book", // Ícono corregido para que se vea correctamente
                irregular: "Decreto 2737 de 1989 (Código del Menor en Colombia); Ley Agote (1919); Tribunal de Chicago (1899).",
                integral: "Convención sobre los Derechos del Niño (1989); Ley 1098 de 2006 (Código de Infancia y Adolescencia)."
            },
            {
                category: "Sujeto central y lenguaje",
                icon: "fa-user-tag",
                irregular: 'El "Menor" (concepto estigmatizante y peyorativo para los niños excluidos).',
                integral: "Niños, Niñas y Adolescentes (NIÑOS, NIÑAS Y ADOLESCENTES) (categoría universal para todo ser humano menor de 18 años)."
            },
            {
                category: "Naturaleza y estatus jurídico",
                icon: "fa-id-card-clip",
                irregular: "Objeto de tutela, compasión, piedad o represión estatal. Sujeto pasivo cosificado.",
                integral: "Sujeto pleno de derechos y deberes; ciudadano con voz activa y derechos prevalentes."
            },
            {
                category: "Objeto y criterio de intervención",
                icon: "fa-magnifying-glass-chart",
                irregular: 'Exclusivamente el menor en "situación irregular" (abandonado o delincuente en potencia).',
                integral: "Todos los niños, niñas y adolescentes; intervención para la garantía y efectividad de sus derechos."
            },
            {
                category: "Rol de la autoridad judicial",
                icon: "fa-gavel",
                irregular: 'Juez de Menores con competencia omnímoda, discrecionalidad absoluta y rol de "buen padre de familia".',
                integral: "Juez especializado en derecho penal/familia, guiado por principios, legalidad e Interés Superior del Niño."
            },
            {
                category: "Garantías procesales",
                icon: "fa-shield-halved",
                irregular: 'Inexistentes o sistemáticamente negadas. La intervención del Estado es no-penal y "un bien".',
                integral: "Plenas garantías del debido proceso acusatorio (presunción de inocencia, contradicción, defensa técnica)."
            },
            {
                category: "Tratamiento de la pobreza y riesgo",
                icon: "fa-hand-holding-dollar",
                irregular: "Criminalización de la pobreza; la falta de recursos materiales justifica el encierro o pérdida de patria potestad.",
                integral: "Las carencias son omisiones de políticas sociales del Estado. Prohibición de separar al niño por pobreza."
            },
            {
                category: "Respuesta al conflicto penal",
                icon: "fa-scale-unbalanced",
                irregular: 'Inimputabilidad paternalista. Sanciones/internaciones indeterminadas bajo el eufemismo de "medidas".',
                integral: "Sistema De Responsabilidad Penal Para Adolescentes con juzgamiento diferenciado y sanciones pedagógicas."
            },
            {
                category: "Régimen de privación de libertad",
                icon: "fa-lock",
                irregular: "Medida común, masiva e indeterminada para mitigar el abandono o delito en instituciones totales.",
                integral: "Excepcionalísima, breve, de última ratio y aplicada solo a delitos graves previamente taxativos."
            },
            {
                category: "Modelo de justicia penal",
                icon: "fa-balance-scale",
                irregular: "Paradigma tutelar-retributivo o de defensa social (castigo, correccionalismo o inocultable segregación).",
                integral: "Paradigma de Intervención Mínima y Justicia Restaurativa (reparación, conciliación, mediación y reinserción)."
            }
        ];

        // Función para renderizar los acordeones
        function renderAccordions() {
            const container = document.getElementById('accordionContainer');
            
            matrixData.forEach((item, index) => {
                const accItem = document.createElement('div');
                accItem.className = 'accordion-item';
                
                accItem.innerHTML = `
                    <div class="accordion-header" onclick="toggleAccordion(this)">
                        <div class="accordion-title-container">
                            <i class="fa-solid ${item.icon} accordion-icon"></i>
                            <span>${item.category}</span>
                        </div>
                        <i class="fa-solid fa-chevron-down toggle-icon"></i>
                    </div>
                    <div class="accordion-content">
                        <div class="accordion-inner">
                            <div class="comparison-bullet bullet-irregular">
                                <div class="bullet-label">
                                    <i class="fa-solid fa-user-lock"></i>
                                    Situación irregular
                                </div>
                                <div class="bullet-text">${item.irregular}</div>
                            </div>
                            <div class="comparison-bullet bullet-integral">
                                <div class="bullet-label">
                                    <i class="fa-solid fa-children"></i>
                                    Protección integral
                                </div>
                                <div class="bullet-text">${item.integral}</div>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(accItem);
            });
        }

        // Lógica de apertura/cierre de acordeón
        function toggleAccordion(element) {
            const parent = element.parentElement;
            const content = parent.querySelector('.accordion-content');
            const allItems = document.querySelectorAll('.accordion-item');

            // Si se hace clic en uno que ya está activo, cerrarlo
            if (parent.classList.contains('active')) {
                parent.classList.remove('active');
                content.style.maxHeight = null;
                return;
            }

            // Cerrar todos los demás
            allItems.forEach(item => {
                item.classList.remove('active');
                item.querySelector('.accordion-content').style.maxHeight = null;
            });

            // Abrir el clickeado
            parent.classList.add('active');
            content.style.maxHeight = content.scrollHeight + "px";
        }

        // Inicializar al cargar
        window.onload = renderAccordions;
    </script>
</body>
</html>
